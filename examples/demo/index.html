<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>romp demo (local)</title>
<style>
  :root { --ink: #0A0A1A; --ink-soft: #12122B; --fg: #F5F3FF; --primary: #4361EE; --accent: #22D3EE; }
  body { margin: 0; background: var(--ink); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .btn { font: 600 15px system-ui; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-outline-primary { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--primary); }
</style>
</head>
<body>
<main><div id="romp-demo"></div></main>
<script type="module">
  // A local harness for the demo (and for scripts/gen-hero-gif.mjs).
  import { mount } from "./dist/romp-demo.js";
  window.romp = mount(document.getElementById("romp-demo"));
</script>
</body>
</html>
